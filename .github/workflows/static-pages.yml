name: Deploy static HTML prototype

on:
  push:
    branches:
      - prototype/static-html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare cache-busted preview
        run: |
          rm -rf static-prototype/preview-v2
          mkdir -p static-prototype/preview-v2
          cp static-prototype/index.html static-prototype/preview-v2/index.html
          cp static-prototype/base.css static-prototype/preview-v2/base.css
          cp static-prototype/motion.css static-prototype/preview-v2/motion.css
          cp static-prototype/hero-motion.css static-prototype/preview-v2/hero-motion.css
          cp static-prototype/storytelling.css static-prototype/preview-v2/storytelling.css
          cp static-prototype/madagascar-motion.css static-prototype/preview-v2/madagascar-motion.css
          cp static-prototype/motion.js static-prototype/preview-v2/motion.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./static-prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
