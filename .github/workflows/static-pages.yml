name: Deploy static HTML prototype

on:
  push:
    branches:
      - prototype/static-html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate modular homepage runtime
        run: |
          node --check static-prototype/motion.js
          node --check static-prototype/preloader-boost.js
          node --check static-prototype/cursor-motion.js
          node --check static-prototype/cinematic-motion.js
          node --check static-prototype/shared-transition.js
          node --check static-prototype/kinetic-typography.js
          node --check static-prototype/material-webgl.js
          node --check static-prototype/motion-director.js
          grep -q 'src="motion.js"' static-prototype/index.html
          grep -q 'src="motion-director.js"' static-prototype/index.html

      - name: Prepare modular preview
        run: |
          rm -rf static-prototype/preview-v2
          mkdir -p static-prototype/preview-v2
          rsync -a --exclude 'preview-v2/' static-prototype/ static-prototype/preview-v2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./static-prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
