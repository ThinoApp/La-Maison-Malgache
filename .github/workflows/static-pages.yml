name: Deploy static HTML prototype

on:
  push:
    branches:
      - prototype/static-html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Materialize WebP assets
        run: node static-prototype/materialize-assets.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./static-prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
